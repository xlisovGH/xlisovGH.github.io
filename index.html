<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xlisovGH.github.io</title>
    <style>
      body {
        font-family: Consolas, monospace;
        background-color: #000;
        overflow: hidden;
        margin: 0;
      }

      .rain-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .drop {
        position: absolute;
        color: #0f0;
        font-size: 1em;
        animation: rain-fall linear infinite;
        opacity: 0;
      }

      .drop.glow {
        --glow-color: #0f0;
        --glow-size1: 5px;
        --glow-size2: 10px;
        text-shadow: 0 0 var(--glow-size1)
            rgba(var(--glow-color-rgb, 0, 255, 0), 0.7),
          0 0 var(--glow-size2) rgba(var(--glow-color-rgb, 0, 255, 0), 0.5);
      }

      .drop.special {
        --glow-color-rgb: 255, 0, 0;
        color: rgb(142, 165, 229);
        text-shadow: 0 0 5px rgba(142, 165, 229, 0.8),
          0 0 10px rgba(142, 165, 229, 0.6);
      }

      @keyframes rain-fall {
        0% {
          transform: translateY(-10vh);
          opacity: 0;
        }
        5% {
          opacity: 1;
        }
        95% {
          opacity: 1;
        }
        100% {
          transform: translateY(110vh);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="rain-container"></div>

    <script>
      const rainContainer = document.querySelector(".rain-container");
      const numDrops = 200;
      const specialChance = 0.001;

      const createDrop = () => {
        const drop = document.createElement("div");
        drop.classList.add("drop");
        const isSpecial = Math.random() < specialChance;

        drop.textContent = isSpecial
          ? "xlisov"
          : Math.random() < 0.5
          ? "0"
          : "1";
        if (isSpecial) {
          drop.classList.add("special");
        } else {
          drop.classList.add("glow");
        }
        drop.style.cssText = `left: ${
          Math.random() * 100
        }vw; animation-duration: ${Math.random() * 3 + 2}s; animation-delay: ${
          Math.random() * 5
        }s;`;
        rainContainer.appendChild(drop);
      };

      for (let i = 0; i < numDrops; i++) {
        createDrop();
      }

      const animate = () => {
        const drops = rainContainer.children;
        for (let i = drops.length - 1; i >= 0; i--) {
          const drop = drops[i];
          if (drop.getBoundingClientRect().top > window.innerHeight) {
            drops[i].remove();
            createDrop();
          }
        }

        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
